server:
  port: 8080

spring:
  application:
    name: spring-boot-observability-demo
  main:
    banner-mode: console

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: spring-boot-observability-demo

logging:
  level:
    root: INFO
    com.example.observabilitydemo: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
